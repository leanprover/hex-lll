name = "hex-lll-bench"
defaultTargets = ["hexlll_bench"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexLLL"
path = ".."

[[require]]
name = "lean-bench"
git = "https://github.com/kim-em/lean-bench.git"
rev = "master"

[[lean_lib]]
name = "HexLLLBench"
precompileModules = true

[[lean_exe]]
name = "hexlll_bench"
root = "HexLLLBench.Main"
