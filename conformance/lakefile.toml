name = "hex-lll-conformance"
defaultTargets = ["HexLLLConformance", "hexlll_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexLLL"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "d06a24207b061257a56199f081fbce9edc6d4e21"

[[lean_lib]]
name = "HexLLLConformance"
globs = ["HexLLL.Conformance"]

[[lean_exe]]
name = "hexlll_emit_fixtures"
root = "HexLLL.EmitFixtures"
